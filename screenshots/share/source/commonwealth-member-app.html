<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;600&display=block"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:675px;overflow:hidden;background:#F6F1E7;color:#14201C;font-family:'Public Sans',system-ui,sans-serif;position:relative}
.awning{position:absolute;left:0;right:0;top:0;height:30px;background:repeating-linear-gradient(90deg,#F2B632 0 32px,#FFFFFF 32px 64px);
 -webkit-mask:linear-gradient(#000 0 0) top/100% 14px no-repeat,radial-gradient(circle 16px at 50% 0,#000 calc(100% - .5px),transparent) 0 14px/32px 16px repeat-x}
.lockup{display:flex;align-items:center;gap:14px}
.wm{font-family:'Bricolage Grotesque';font-weight:800;letter-spacing:-.025em;line-height:1}.wm .c{color:#12463A}.wm .w{color:#A8481A}
.end{font-weight:600;color:#56625C;margin-top:6px}
.ccc{font-family:'Bricolage Grotesque';font-weight:800;letter-spacing:-.02em;color:#12463A;line-height:1}
.coll{font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:#A8481A;margin-top:7px}
h1{font-family:'Bricolage Grotesque';font-weight:800;letter-spacing:-.035em;line-height:.98;text-wrap:balance}
p.lead{font-size:21px;line-height:1.45;color:#3a4741;max-width:460px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#56625C}
.phone{background:#14201C;border-radius:44px;padding:10px;flex-shrink:0}
.phone img{display:block;width:100%;border-radius:35px}
.browser{background:#FFFFFF;border:2px solid #14201C;border-radius:14px;overflow:hidden;flex-shrink:0}
.browser .bar{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;background:#14201C}
.browser .bar i{width:10px;height:10px;border-radius:50%;background:#F6F1E7;opacity:.55}
.browser .bar span{margin-left:10px;font-size:12px;font-weight:600;color:#F6F1E7;opacity:.85}
.browser img{display:block;width:100%}
.tag{display:inline-block;padding:6px 12px;border-radius:999px;background:#F2B632;color:#14201C;font-weight:600;font-size:14px}
.foot{position:absolute;left:64px;bottom:34px;font-size:13px;color:#56625C}
</style></head><body>
<div class="awning"></div>
<div style="position:absolute;left:64px;top:84px;width:430px;display:flex;flex-direction:column;gap:26px">
  <div class="lockup"><svg viewBox="72 72 576 576" width="56" height="56" aria-hidden="true"><defs><clipPath id="c56"><circle cx="360" cy="360" r="252"/></clipPath></defs><circle cx="360" cy="360" r="288" fill="#12463A"/><g clip-path="url(#c56)"><rect x="60" y="100" width="150" height="223" fill="#F2B632"/><circle cx="135" cy="323" r="75" fill="#F2B632"/><rect x="210" y="100" width="150" height="223" fill="#F6F1E7"/><circle cx="285" cy="323" r="75" fill="#F6F1E7"/><rect x="360" y="100" width="150" height="223" fill="#F2B632"/><circle cx="435" cy="323" r="75" fill="#F2B632"/><rect x="510" y="100" width="150" height="223" fill="#F6F1E7"/><circle cx="585" cy="323" r="75" fill="#F6F1E7"/></g><polygon points="127,456 593,456 579,486 141,486" fill="#F2B632"/></svg><div><div class="wm" style="font-size:34px"><span class="c">Common</span><span class="w">Wealth</span></div><div class="end" style="font-size:12px">by Common Cents Collective</div></div></div>

  <p class="lead" style="font-size:19px;max-width:420px">Pay neighborhood shops from one balance. Earn 5 points per $1, worth $0.01 each at every member shop.</p>
  <div><span class="tag">Member app prototype</span></div>
</div>
<div style="position:absolute;right:48px;top:66px;display:flex;gap:18px;align-items:flex-start">

  <div><div class="phone" style="width:200px"><img src="../../screens/member-04-pay.png"></div></div>
  <div style="margin-top:130px"><div class="phone" style="width:200px"><img src="../../screens/member-06-receipt.png"></div></div>
</div></body></html>
